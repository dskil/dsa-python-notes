name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt && pip install -e .
      - name: Regenerate catalog page
        run: python tools/build_catalog.py --write
      - name: Fail on drift
        run: git diff --exit-code -- docs/tasks.md
